name: Local runtime tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Go tests, vet, Python integration and full-loop demo
        run: python scripts/verify.py
      - name: Race detection
        if: runner.os == 'Linux'
        run: go test -race ./... -count=1 -timeout=120s
